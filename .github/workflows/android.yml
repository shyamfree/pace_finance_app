name: Build Pace Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare stable signing key
        env:
          PACE_KEYSTORE_BASE64: ${{ secrets.PACE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PACE_KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub secret PACE_KEYSTORE_BASE64 is missing."
            echo "Create the four Pace signing secrets described in README.md, then rerun the workflow."
            exit 1
          fi
          echo "$PACE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/pace-signing.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        env:
          PACE_KEYSTORE_PATH: ${{ github.workspace }}/pace-signing.jks
          PACE_KEYSTORE_PASSWORD: ${{ secrets.PACE_KEYSTORE_PASSWORD }}
          PACE_KEY_ALIAS: ${{ secrets.PACE_KEY_ALIAS }}
          PACE_KEY_PASSWORD: ${{ secrets.PACE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Build signed release APK
        env:
          PACE_KEYSTORE_PATH: ${{ github.workspace }}/pace-signing.jks
          PACE_KEYSTORE_PASSWORD: ${{ secrets.PACE_KEYSTORE_PASSWORD }}
          PACE_KEY_ALIAS: ${{ secrets.PACE_KEY_ALIAS }}
          PACE_KEY_PASSWORD: ${{ secrets.PACE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pace-release-apk
          path: app/build/outputs/apk/release/app-release.apk
